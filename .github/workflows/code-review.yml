name: AI Code Review
on: 
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # Triggers on PR events
permissions:
  contents: read
  pull-requests: write  # Allows posting comments on PRs

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AI PR Review
        # v1.0.0
        uses: jonit-dev/openrouter-github-action@88f63615c769f8db6031973503c2c40a9a3f4feb
        with:
          # Required inputs
          github_token: ${{ secrets.GITHUB_TOKEN }} # Automatically provided
          open_router_key: ${{ secrets.OPEN_ROUTER_KEY }} # Must be set in repository secrets

          # Optional inputs with defaults
          # model_id: 'openai/gpt-4o-mini' # Cheap and Fast
          # model_id: 'anthropic/claude-sonnet-4.5' # Catch nuanced bugs
          model_id: 'z-ai/glm-5.3-flash' # Cheap but goood
          max_tokens: '2048' # Default max tokens
          review_label: 'ai-review' # Optional: Only review PRs with this label

          # Optional custom prompt
          custom_prompt: |
            Investigate this PR like a senior engineer. Explore the repository, understand the intended behavior, inspect callers/tests, and report only actionable defects.
            Limit to 3 critical/high-priority, high quality and actionable suggestions.
           
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
